name: SATC Website CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate website files
        run: |
          test -f index.html
          grep -qi '<!DOCTYPE html>' index.html
          grep -qi '</html>' index.html
          echo "Website validation passed."

  deploy:
    name: Deploy to AWS
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Submit website deployment
        shell: bash
        run: |
          set -euo pipefail

          COMMANDS=$(jq -n --arg url \
            "https://raw.githubusercontent.com/stephansatcproject/dv2023h9h0q8project/main/index.html" \
            '{
              commands: [
                "set -eu",
                "mkdir -p /var/www/html",
                ("curl --fail --silent --show-error --location " + ($url | @sh) + " -o /tmp/satc-index.html"),
                "grep -qi \"<!DOCTYPE html>\" /tmp/satc-index.html",
                "grep -qi \"</html>\" /tmp/satc-index.html",
                "cp /var/www/html/index.html /var/www/html/index.html.bak 2>/dev/null || true",
                "install -o root -g root -m 644 /tmp/satc-index.html /var/www/html/index.html",
                "rm -f /tmp/satc-index.html",
                "systemctl is-active --quiet httpd",
                "curl --fail --silent --show-error http://localhost/ -o /dev/null",
                "echo SATC website deployment and local health check succeeded"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Project,Values=SATC" \
            --parameters "$COMMANDS" \
            --comment "Deploy SATC website from GitHub Actions" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            INVOCATIONS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --output json)

            COUNT=$(echo "$INVOCATIONS" | jq '.CommandInvocations | length')

            if [ "$COUNT" -gt 0 ]; then
              STATUS=$(echo "$INVOCATIONS" | jq -r \
                '[.CommandInvocations[].Status] |
                 if any(. == "Failed" or . == "Cancelled" or . == "TimedOut" or . == "Undeliverable" or . == "Terminated") then "Failed"
                 elif all(. == "Success") then "Success"
                 else "Pending" end')

              if [ "$STATUS" = "Success" ]; then
                echo "$INVOCATIONS" | jq -r \
                  '.CommandInvocations[] | "\(.InstanceId): \(.Status)"'
                exit 0
              fi

              if [ "$STATUS" = "Failed" ]; then
                echo "$INVOCATIONS" | jq .
                exit 1
              fi
            fi

            sleep 10
          done

          echo "Deployment did not complete successfully within 5 minutes."
          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --output json
          exit 1
