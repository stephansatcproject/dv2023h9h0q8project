name: SATC Website CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate website files
        run: |
          test -f index.html
          grep -qi '<!DOCTYPE html>' index.html
          grep -qi '</html>' index.html
          echo "Website validation passed."

  deploy:
    name: Deploy to AWS
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1


      - name: Deploy website with automatic rollback
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<'SCRIPT'
          set -eu

          WEB_ROOT="/var/www/html"
          BACKUP="$WEB_ROOT/index.html.bak"
          TEMP_FILE="/tmp/satc-index.html"
          URL="https://raw.githubusercontent.com/stephansatcproject/dv2023h9h0q8project/main/index.html"

          # Download and validate the candidate before touching the live page.
          curl --fail --silent --show-error --location "$URL" -o "$TEMP_FILE"
          grep -qi '<!DOCTYPE html>' "$TEMP_FILE"
          grep -qi '</html>' "$TEMP_FILE"

          # Preserve the currently deployed version.
          if [ ! -f "$WEB_ROOT/index.html" ]; then
            echo "No current website exists to back up."
            exit 1
          fi

          cp -p "$WEB_ROOT/index.html" "$BACKUP"

          # Install the new page, then test Apache and the local response.
          if install -o root -g root -m 644 "$TEMP_FILE" "$WEB_ROOT/index.html" \
            && systemctl is-active --quiet httpd \
            && curl --fail --silent --show-error http://localhost/ -o /dev/null; then
            rm -f "$TEMP_FILE"
            echo "Deployment and local health check succeeded."
            exit 0
          fi

          echo "Deployment or health check failed. Restoring previous website."
          cp -p "$BACKUP" "$WEB_ROOT/index.html"
          rm -f "$TEMP_FILE"

          if systemctl is-active --quiet httpd \
            && curl --fail --silent --show-error http://localhost/ -o /dev/null; then
            echo "Rollback succeeded. Previous website restored."
          else
            echo "WARNING: Previous page restored, but health check still fails."
          fi

          exit 1
          SCRIPT
          )

          PARAMETERS=$(jq -n --arg cmd "$REMOTE_SCRIPT" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Project,Values=SATC" \
            --parameters "$PARAMETERS" \
            --comment "Deploy SATC website with rollback" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            INVOCATIONS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --output json)

            COUNT=$(echo "$INVOCATIONS" | jq '.CommandInvocations | length')

            if [ "$COUNT" -gt 0 ]; then
              STATUS=$(echo "$INVOCATIONS" | jq -r \
                '[.CommandInvocations[].Status] |
                 if any(. == "Failed" or . == "Cancelled" or . == "TimedOut" or . == "Undeliverable" or . == "Terminated") then "Failed"
                 elif all(. == "Success") then "Success"
                 else "Pending" end')

              if [ "$STATUS" = "Success" ]; then
                echo "$INVOCATIONS" | jq -r \
                  '.CommandInvocations[] | "\(.InstanceId): \(.Status)"'
                exit 0
              fi

              if [ "$STATUS" = "Failed" ]; then
                echo "$INVOCATIONS" | jq .
                exit 1
              fi
            fi

            sleep 10
          done

          echo "Deployment did not finish within 5 minutes."
          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" --details --output json
          exit 1



      - name: Verify website through Load Balancer
        shell: bash
        run: |
          set -euo pipefail

          URL="http://stephanloadbal-822877877.eu-north-1.elb.amazonaws.com"

          for attempt in $(seq 1 12); do
            STATUS=$(curl --silent --output /tmp/satc-live.html \
              --write-out "%{http_code}" --max-time 10 "$URL" || true)

            echo "Attempt $attempt: HTTP status $STATUS"

            if [ -s /tmp/satc-live.html ]; then
              echo "Response preview:"
              head -c 500 /tmp/satc-live.html
              echo
            fi

            if [ "$STATUS" = "200" ] \
              && grep -qi "SATC" /tmp/satc-live.html; then
              echo "Load Balancer health check passed."
              exit 0
            fi

            sleep 5
          done

          echo "Load Balancer health check failed."
          exit 1
