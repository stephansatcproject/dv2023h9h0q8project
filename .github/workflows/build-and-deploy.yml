name: SATC Website CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f appspec.yml
          test -f scripts/install_website.sh

      - name: Basic HTML checks
        run: |
          grep -qi '<!DOCTYPE html>' index.html
          grep -qi '</html>' index.html
          echo "Website validation passed."

  deploy:
    name: Deploy to AWS
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy website through SSM
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<'SCRIPT'
          set -eu

          URL="https://raw.githubusercontent.com/stephansatcproject/dv2023h9h0q8project/main/index.html"
          WEB_ROOT="/var/www/html"
          TEMP_FILE="/tmp/satc-index.html"

          curl --fail --silent --show-error --location "$URL" -o "$TEMP_FILE"
          grep -qi '<!DOCTYPE html>' "$TEMP_FILE"
          grep -qi '</html>' "$TEMP_FILE"

          if [ -f "$WEB_ROOT/index.html" ]; then
            cp "$WEB_ROOT/index.html" "$WEB_ROOT/index.html.bak"
          fi

          install -o root -g root -m 644 "$TEMP_FILE" "$WEB_ROOT/index.html"
          rm -f "$TEMP_FILE"

          systemctl is-active --quiet httpd
          curl --fail --silent http://localhost/ -o /dev/null

          echo "SATC website deployed and local health check passed."
          SCRIPT
          )

          PARAMETERS=$(jq -n --arg cmd "$REMOTE_SCRIPT" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Project,Values=SATC" \
            --parameters "$PARAMETERS" \
            --comment "Deploy SATC website from GitHub Actions" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            RESULT=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --output json)

            STATUS=$(echo "$RESULT" | jq -r \
              '[.CommandInvocations[].Status] | if length == 0 then "Pending" elif all(. == "Success") then "Success" elif any(. == "Failed" or . == "Cancelled" or . == "TimedOut" or . == "Undeliverable" or . == "Terminated") then "Failed" else "Pending" end')

            if [ "$STATUS" = "Success" ]; then
              echo "$RESULT" | jq -r \
                '.CommandInvocations[] | "\(.InstanceId): \(.Status)"'
              exit 0
            fi

            if [ "$STATUS" = "Failed" ]; then
              echo "$RESULT" | jq .
              exit 1
            fi

            sleep 10
          done

          echo "SSM command did not finish within 5 minutes."
          echo "$RESULT" | jq .
          exit 1
